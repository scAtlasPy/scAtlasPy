[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"


[project]
name = "scatlaspy"
version = "0.1.0"
license = "BSD-3-Clause"

dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "pandas>=2.3.3",
    "h5py>=3.11.0",
    "matplotlib>=3.10.0",
    "tqdm>=4.68.2",
    "scikit-learn>=1.7.0",
    "umap-learn>=0.5.12",
    
    "anndata>=0.11.4",
    "pyarrow>=24.0.0",
    "scanpy>=1.11.5",
    "duckdb>=1.5.3",
]


[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.155.2",
    "psutil>=7.2.2",
]

docs = [
    "sphinx>=9.0.4",
    "myst-parser>=5.1.0",
    "myst-nb>=1.4.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinx-autodoc-typehints>=3.6.1",
    "sphinx-book-theme>=1.2.0",
    "numpydoc>=1.10.0",
    "ipywidgets>=8.1.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scatlaspy*"]
namespaces = false


[tool.setuptools.package-data]
scatlaspy = [
    "resources/*.sql",
    "resources/*.json",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "l0: hand-checkable edge cases and exact storage assertions",
    "l1: randomized and property-style tests",
    "l2: reference parity tests against SciPy or Scanpy",
    "l3: large streaming, memory, concurrency, and performance tests",
    "l4: release stress tests for million-plus scale validation",
    "slow: tests that are too slow for quick local iteration",
    "stress: resource-intensive stress tests",
    "ml: tests that exercise minibatch machine learning workflows",
    "reference: tests that compare against mature reference implementations",
    "realdata: opt-in tests against user-provided real datasets",
    "import_benchmark: opt-in import time and RSS benchmark tests",
]
