[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "scatlaspy"
version = "0.1.0"
license = "BSD-3-Clause"

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "h5py",
    "matplotlib",
    "tqdm",
    "scikit-learn",
    "umap-learn",
    
    "anndata>=0.8.0",
    "pyarrow>=23.0.0",
    "scanpy>=1.11.5",
    "duckdb>=1.4.3",
]


[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis",
    "psutil",
]

docs = [
    "sphinx>=7",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "sphinx-book-theme",
    "numpydoc",
]

ml = [
    "torch",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["scatlaspy*"]
namespaces = false


[tool.setuptools.package-data]
scatlaspy = [
    "resources/*.sql",
    "resources/*.json",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "l0: hand-checkable edge cases and exact storage assertions",
    "l1: randomized and property-style tests",
    "l2: reference parity tests against SciPy or Scanpy",
    "l3: large streaming, memory, concurrency, and performance tests",
    "l4: release stress tests for million-plus scale validation",
    "slow: tests that are too slow for quick local iteration",
    "stress: resource-intensive stress tests",
    "ml: tests that exercise minibatch machine learning workflows",
    "reference: tests that compare against mature reference implementations",
    "realdata: opt-in tests against user-provided real datasets",
    "import_benchmark: opt-in import time and RSS benchmark tests",
]
