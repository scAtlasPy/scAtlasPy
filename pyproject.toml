[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"


[project]
name = "scatlaspy"
version = "0.1.0"
description = "A scalable Python platform for atlas-scale single-cell omics analysis beyond in-memory limits."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Han Xu" },
    { name = "Yangzhan Ye" },
    { name = "Senpeng Zhang" },
]
maintainers = [
    { name = "scAtlasPy development team" },
]
keywords = [
    "single-cell",
    "cell atlas",
    "bioinformatics",
    "omics",
    "out-of-core"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "pandas>=2.3.3",
    "h5py>=3.11.0",
    "matplotlib>=3.10.0",
    "tqdm>=4.68.2",
    "scikit-learn>=1.7.0",
    "umap-learn>=0.5.12",
    
    "anndata>=0.11.4",
    "pyarrow>=24.0.0",
    "scanpy>=1.11.5",
    "duckdb>=1.5.3",
]


[project.optional-dependencies]
parametric = [
    "torch>=2.2.0",
]

test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.155.2",
    "psutil>=7.2.2",
]

docs = [
    "sphinx>=8.1.3,<8.2",
    "myst-parser>=4.0.1,<5.0",
    "myst-nb>=1.4.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1,<0.7",
    "sphinx-autodoc-typehints>=3.0.1,<3.1",
    "sphinx-book-theme>=1.1.4,<1.2",
    "numpydoc>=1.10.0",
    "ipywidgets>=8.1.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scatlaspy*"]
namespaces = false


[tool.setuptools.package-data]
scatlaspy = [
    "resources/*.sql",
    "resources/*.json",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "storage: tests for Atlas database schema and AnnData import/export behavior",
    "preprocessing: tests for filtering, QC, and derived expression transforms",
    "minibatch: tests for read-index construction and dense minibatch reading",
    "workflow: tests for PCA, clustering, ranking, and annotation workflows",
    "slow: tests that are too slow for quick local iteration",
    "realdata: opt-in tests against user-provided real datasets",
]

[project.urls]
Homepage = "https://github.com/GaoLabXDU/scatlaspy"
Documentation = "https://scatlaspy.readthedocs.io"
Repository = "https://github.com/GaoLabXDU/scatlaspy"
Issues = "https://github.com/GaoLabXDU/scatlaspy/issues"
